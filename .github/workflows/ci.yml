name: ICC tests and package checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and tests
        run: python -m pip install -e ".[dev]"
      - name: Python syntax check
        run: python -m compileall -q icc_calc.py cli.py agents tests enrichment.py
      - name: Test suite
        run: python -m pytest -q
      - name: Build wheel
        run: python -m pip wheel --no-deps . -w /tmp/icc-wheel
      - name: Validate wheel contents
        run: |
          python - <<'PY'
          import glob, zipfile
          wheels = glob.glob("/tmp/icc-wheel/*.whl")
          assert len(wheels) == 1, wheels
          with zipfile.ZipFile(wheels[0]) as wheel:
              names = wheel.namelist()
              for required in ("icc_calc.py", "cli.py", "agents/base.py"):
                  assert required in names, required
          PY

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax and reference tests
        run: |
          node --check web/icc.js
          node --test web/test_icc.js
      - name: Static web resources
        run: |
          test -s web/index.html
          test -s web/icc.js
          grep -q 'src="./icc.js"' web/index.html
