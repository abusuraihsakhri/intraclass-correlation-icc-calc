[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intraclass-correlation-icc-calc"
version = "3.1.0"
description = "ANOVA-based intraclass correlation coefficients and cluster design effect"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Dr. Abu Suraih Sakhri"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["fastapi>=0.111", "uvicorn>=0.27", "pydantic>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
icc-calc = "cli:main"
icc-anova = "icc_calc:main"

[tool.setuptools]
py-modules = ["icc_calc", "cli", "enrichment", "simulator"]

[tool.setuptools.packages.find]
include = ["agents*"]

[tool.pytest.ini_options]
testpaths = ["tests", "."]
python_files = ["test_*.py"]
